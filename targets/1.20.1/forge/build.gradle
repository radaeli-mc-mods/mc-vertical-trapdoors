buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

def identity = new Properties()
rootProject.file('../../gradle.properties').withInputStream { identity.load(it) }
def targetProps = new Properties()
rootProject.file('gradle.properties').withInputStream { targetProps.load(it) }

def minecraftVersion = targetProps.getProperty('minecraft_version')
def forgeVersion = targetProps.getProperty('forge_version')
def modVersion = findProperty('mod_version') ?: identity.getProperty('mod_version')
def modId = identity.getProperty('mod_id')
def javaVersion = targetProps.getProperty('java_version') as int

group = identity.getProperty('mod_group_id')
version = "${modVersion}+${minecraftVersion}-forge"
base { archivesName = modId }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraftVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('../../../runs/forge-1.20.1')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${modId}" { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories { }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'verticaltrapdoors.refmap.json'
    config 'verticaltrapdoors.mixins.json'
    config 'verticaltrapdoors.client.mixins.json'
}

sourceSets.main.java.srcDir(rootProject.file('src/main/java'))
sourceSets.main.java.srcDir(rootProject.file('../../shared/src/main/java'))
sourceSets.main.java.srcDir(rootProject.file('../../shared/src/client/java'))

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.compilerArgs += ['-AdefaultObfuscationEnv=searge']
}

processResources {
    def expanded = [
        version: "${modVersion}+${minecraftVersion}",
        mod_id: modId,
        mod_name: identity.getProperty('mod_name'),
        mod_description: identity.getProperty('mod_description'),
        mod_authors: identity.getProperty('mod_authors'),
        mod_license: identity.getProperty('mod_license'),
        minecraft_version: minecraftVersion,
        forge_version: forgeVersion,
        forge_loader_version_range: targetProps.getProperty('forge_loader_version_range')
    ]
    inputs.properties(expanded)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand(expanded) }
}

jar {
    manifest {
        attributes([
            'Specification-Title': modId,
            'Specification-Vendor': identity.getProperty('mod_authors'),
            'Specification-Version': '1',
            'Implementation-Title': identity.getProperty('mod_name'),
            'Implementation-Version': project.version,
            'Implementation-Vendor': identity.getProperty('mod_authors'),
            'MixinConfigs': 'verticaltrapdoors.mixins.json,verticaltrapdoors.client.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('build').configure { dependsOn 'reobfJar' }
