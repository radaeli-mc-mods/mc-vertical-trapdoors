plugins {
    id 'fabric-loom' version '1.9.2'
}

def identity = new Properties()
rootProject.file('../../gradle.properties').withInputStream { identity.load(it) }
def targetProps = new Properties()
rootProject.file('gradle.properties').withInputStream { targetProps.load(it) }

def minecraftVersion = targetProps.getProperty('minecraft_version')
def modVersion = findProperty('mod_version') ?: identity.getProperty('mod_version')
def modId = identity.getProperty('mod_id')
def javaVersion = targetProps.getProperty('java_version') as int

group = identity.getProperty('mod_group_id')
version = "${modVersion}+${minecraftVersion}-fabric"
base { archivesName = modId }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        verticaltrapdoors {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.srcDir(rootProject.file('src/main/java'))
        java.srcDir(rootProject.file('../../shared/src/main/java'))
    }
    client {
        java.srcDir(rootProject.file('../../shared/src/client/java'))
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${targetProps.getProperty('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${targetProps.getProperty('fabric_api_version')}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

processResources {
    def expanded = [
        version: modVersion,
        minecraft_version: minecraftVersion,
        fabric_loader_version: targetProps.getProperty('fabric_loader_version'),
        fabric_api_version: targetProps.getProperty('fabric_api_version'),
        mod_id: modId,
        mod_name: identity.getProperty('mod_name'),
        mod_description: identity.getProperty('mod_description'),
        mod_authors: identity.getProperty('mod_authors'),
        mod_license: identity.getProperty('mod_license')
    ]
    inputs.properties(expanded)
    filesMatching('fabric.mod.json') { expand(expanded) }
}

tasks.named('jar').configure {
    from sourceSets.client.output
}
