name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targets:
    name: Read target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: echo "matrix=$(jq -c '.targets' .github/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.minecraft }} / ${{ matrix.loader }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build target and tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ${{ matrix.project }}:clean ${{ matrix.project }}:build --no-daemon --no-parallel --console=plain
      - name: Inspect production JAR
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$(dirname '${{ matrix.artifact }}')" -maxdepth 1 -type f -name "$(basename '${{ matrix.artifact }}')" ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          test "${#jars[@]}" -eq 1
          python tools/check_jar.py \
            --jar "${jars[0]}" \
            --minecraft-version '${{ matrix.minecraft }}' \
            --loader '${{ matrix.loader }}' \
            --java '${{ matrix.java }}' \
            --mod-id verticaltrapdoors \
            --mod-version "$(sed -nE 's/^mod_version=([^[:space:]]+)$/\1/p' gradle.properties)"
          jar_name="$(basename "${jars[0]}")"
          (cd "$(dirname "${jars[0]}")" && sha256sum "$jar_name" > "$jar_name.sha256")
          mkdir -p artifact-out
          cp "${jars[0]}" "${jars[0]}.sha256" artifact-out/
          cp -R '${{ matrix.directory }}/neoforge/build/reports/tests/test' artifact-out/test-report
          cp -R '${{ matrix.directory }}/neoforge/build/test-results/test' artifact-out/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: verticaltrapdoors-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            artifact-out/
          if-no-files-found: error
