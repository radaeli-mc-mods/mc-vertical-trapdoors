name: Build release tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Newly created semantic tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  targets:
    name: Read target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
      - id: read
        shell: bash
        run: echo "matrix=$(jq -c '.targets' .github/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.minecraft }} / ${{ matrix.loader }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build target and tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" ${{ matrix.project }}:clean ${{ matrix.project }}:build --no-daemon --no-parallel --console=plain
      - name: Inspect production JAR
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$(dirname '${{ matrix.artifact }}')" -maxdepth 1 -type f -name "$(basename '${{ matrix.artifact }}')" ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          test "${#jars[@]}" -eq 1
          python tools/check_jar.py \
            --jar "${jars[0]}" \
            --minecraft-version '${{ matrix.minecraft }}' \
            --loader '${{ matrix.loader }}' \
            --java '${{ matrix.java }}' \
            --mod-id verticaltrapdoors \
            --mod-version "${RELEASE_TAG#v}"
          jar_name="$(basename "${jars[0]}")"
          (cd "$(dirname "${jars[0]}")" && sha256sum "$jar_name" > "$jar_name.sha256")
          mkdir -p artifact-out
          cp "${jars[0]}" "${jars[0]}.sha256" artifact-out/
          mkdir -p artifact-out/test-reports
          if [[ -d '${{ matrix.directory }}/${{ matrix.loader }}/build/reports/tests/test' ]]; then
            cp -R '${{ matrix.directory }}/${{ matrix.loader }}/build/reports/tests/test' artifact-out/test-report
          fi
          if [[ -d '${{ matrix.directory }}/${{ matrix.loader }}/build/test-results/test' ]]; then
            cp -R '${{ matrix.directory }}/${{ matrix.loader }}/build/test-results/test' artifact-out/test-results
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verticaltrapdoors-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            artifact-out/
          if-no-files-found: error

  publish:
    needs: [targets, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: verticaltrapdoors-*
          merge-multiple: true
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar release-artifacts/*.sha256)
          test "${#jars[@]}" -gt 0
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "Vertical Trapdoors $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "${jars[@]}" --clobber
